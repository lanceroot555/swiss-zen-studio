<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-label="Ilustrasi alur kerja digital: website, pencarian, iklan, dan data yang saling terhubung">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF6F3"/>
      <stop offset="1" stop-color="#F7F2EE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F25C40"/>
      <stop offset="1" stop-color="#FF8A5B"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF7F4"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8A5A48" flood-opacity="0.13"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="500" cy="120" r="96" fill="#F25C40" opacity="0.13" filter="url(#glow)"/>
  <circle cx="150" cy="450" r="86" fill="#52D352" opacity="0.10" filter="url(#glow)"/>

  <!-- Panel utama: website -->
  <g filter="url(#sh)">
    <rect x="72" y="196" width="300" height="212" rx="18" fill="url(#soft)" stroke="#EFE3DC"/>
  </g>
  <rect x="72" y="196" width="300" height="38" rx="18" fill="#F6EDE8"/>
  <rect x="72" y="216" width="300" height="18" fill="#F6EDE8"/>
  <circle cx="96" cy="215" r="5" fill="#F25C40"/>
  <circle cx="114" cy="215" r="5" fill="#F0B27A"/>
  <circle cx="132" cy="215" r="5" fill="#8FD6A0"/>
  <rect x="94" y="256" width="132" height="12" rx="6" fill="#26201D" opacity="0.82"/>
  <rect x="94" y="278" width="200" height="8" rx="4" fill="#26201D" opacity="0.20"/>
  <rect x="94" y="294" width="168" height="8" rx="4" fill="#26201D" opacity="0.20"/>
  <rect x="94" y="322" width="96" height="30" rx="15" fill="url(#accent)"/>
  <rect x="110" y="333" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.92"/>
  <rect x="206" y="322" width="86" height="30" rx="15" fill="none" stroke="#EFE3DC" stroke-width="2"/>

  <!-- Kartu pencarian -->
  <g filter="url(#sh)">
    <rect x="404" y="120" width="184" height="88" rx="16" fill="#FFFFFF" stroke="#EFE3DC"/>
  </g>
  <circle cx="436" cy="156" r="11" fill="none" stroke="#F25C40" stroke-width="3"/>
  <line x1="444" y1="164" x2="453" y2="173" stroke="#F25C40" stroke-width="3" stroke-linecap="round"/>
  <rect x="466" y="146" width="98" height="9" rx="4.5" fill="#26201D" opacity="0.75"/>
  <rect x="466" y="163" width="72" height="7" rx="3.5" fill="#26201D" opacity="0.22"/>
  <rect x="420" y="184" width="150" height="7" rx="3.5" fill="#26201D" opacity="0.14"/>

  <!-- Kartu iklan -->
  <g filter="url(#sh)">
    <rect x="404" y="232" width="184" height="88" rx="16" fill="#FFFFFF" stroke="#EFE3DC"/>
  </g>
  <rect x="420" y="248" width="30" height="30" rx="10" fill="url(#accent)" opacity="0.16"/>
  <path d="M428 269 L434 259 L440 264 L447 251" fill="none" stroke="#F25C40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="462" y="252" width="102" height="9" rx="4.5" fill="#26201D" opacity="0.75"/>
  <rect x="462" y="269" width="64" height="7" rx="3.5" fill="#26201D" opacity="0.22"/>
  <rect x="420" y="296" width="150" height="7" rx="3.5" fill="#26201D" opacity="0.14"/>

  <!-- Kartu marketplace -->
  <g filter="url(#sh)">
    <rect x="404" y="344" width="184" height="88" rx="16" fill="#FFFFFF" stroke="#EFE3DC"/>
  </g>
  <path d="M424 366 h10 l7 22 h22 l7 -16 h-30" fill="none" stroke="#F25C40" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="444" cy="398" r="4.5" fill="#F25C40"/>
  <circle cx="462" cy="398" r="4.5" fill="#F25C40"/>
  <rect x="466" y="364" width="98" height="9" rx="4.5" fill="#26201D" opacity="0.75"/>
  <rect x="466" y="381" width="70" height="7" rx="3.5" fill="#26201D" opacity="0.22"/>
  <rect x="420" y="408" width="150" height="7" rx="3.5" fill="#26201D" opacity="0.14"/>

  <!-- Konektor -->
  <path d="M372 250 C 392 250, 388 164, 404 164" fill="none" stroke="#F25C40" stroke-width="2.4" stroke-dasharray="6 6" opacity="0.55"/>
  <path d="M372 288 C 392 288, 388 276, 404 276" fill="none" stroke="#F25C40" stroke-width="2.4" stroke-dasharray="6 6" opacity="0.55"/>
  <path d="M372 330 C 392 330, 388 388, 404 388" fill="none" stroke="#F25C40" stroke-width="2.4" stroke-dasharray="6 6" opacity="0.55"/>

  <!-- Blok data / hasil -->
  <g filter="url(#sh)">
    <rect x="72" y="66" width="230" height="94" rx="16" fill="#FFFFFF" stroke="#EFE3DC"/>
  </g>
  <rect x="92" y="86" width="60" height="8" rx="4" fill="#26201D" opacity="0.30"/>
  <rect x="92" y="106" width="30" height="34" rx="6" fill="url(#accent)" opacity="0.85"/>
  <rect x="128" y="118" width="26" height="22" rx="6" fill="#F25C40" opacity="0.45"/>
  <rect x="160" y="98" width="26" height="42" rx="6" fill="#F25C40" opacity="0.65"/>
  <rect x="192" y="126" width="26" height="14" rx="6" fill="#F25C40" opacity="0.30"/>
  <rect x="228" y="106" width="54" height="34" rx="8" fill="#F6EDE8"/>
  <rect x="238" y="118" width="34" height="10" rx="5" fill="#52D352" opacity="0.75"/>

  <!-- Titik hasil -->
  <g>
    <circle cx="286" cy="486" r="7" fill="#F25C40"/>
    <circle cx="330" cy="486" r="7" fill="#F25C40" opacity="0.55"/>
    <circle cx="374" cy="486" r="7" fill="#F25C40" opacity="0.28"/>
  </g>
</svg>
